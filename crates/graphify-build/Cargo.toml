[package]
name = "graphify-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graph assembly and deduplication for graphify"

[dependencies]
graphify-core.workspace = true
tracing.workspace = true
thiserror.workspace = true
# 0.32: shares the same libsqlite3-sys as zopay (zopay-db/zopay-search); two
# versions cannot coexist because they both declare `links="sqlite3"`. API compatible.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
